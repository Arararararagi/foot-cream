# Crowdin configuration for Footcream.
#
# Keeping this in the repo means the source/translation file mapping is
# reviewable and version-controlled instead of clicked through the web UI —
# `crowdin` CLI and the GitHub integration both read it.
#
# Paths are relative to the REPO root, and the repo root is this directory:
# Fank1/foot-cream mirrors foot-free/plugin/, not the whole working tree.
#
# NO CREDENTIALS HERE. project_id and api_token come from the environment
# (CROWDIN_PROJECT_ID / CROWDIN_PERSONAL_TOKEN) so this file stays safe to
# commit to a public repo.
"preserve_hierarchy": true

files:
  # Required set — menus, buttons, dialogs, notifications (139 strings).
  - source: /l10n/templates/foot-cream-labels.pot
    translation: /l10n/%locale_with_underscore%/labels.po
    languages_mapping: &footcream_locales
      locale_with_underscore:
        # ── WHY THIS SECTION EXISTS ────────────────────────────────────────
        # At runtime the plugin loads
        #     l10n/<KOReader's current_lang>/foot-cream.mo
        # so the directory name must be KOReader's code, not Crowdin's.
        # Crowdin's default %locale_with_underscore% yields de_DE where
        # KOReader wants plain de. Get this wrong and the .mo is built,
        # shipped, and silently never loaded — no error, just an untranslated
        # UI. builder/build_l10n.sh rejects unknown directories so a bad
        # mapping fails the build instead of shipping.
        #
        # ── VERIFIED 2026-08-10 ────────────────────────────────────────────
        # Generated from Crowdin's live language list
        # (GET https://api.crowdin.com/api/v2/languages, public, no auth) and
        # cross-checked against plugin/l10n/LOCALES — NOT hand-guessed. Keys
        # are the %locale_with_underscore% Crowdin emits; values are the
        # directory names the plugin loads.
        #
        # Not present, deliberately:
        #   ia, ie  — Interlingua/Interlingue: Crowdin doesn't offer them.
        #   ro_MD   — Crowdin has only `ro` (ro-RO); no Moldovan Romanian, so
        #             it would collide with `ro` and one would overwrite the
        #             other. KOReader users on ro_MD fall back to English.
        # Re-run builder/check_crowdin_map.py after any edit here.
        af_ZA: af_ZA
        ar_SA: ar
        be_BY: be
        bg_BG: bg_BG
        bn_BD: bn
        ca_ES: ca
        cs_CZ: cs
        cy_GB: cy
        da_DK: da
        de_DE: de
        el_GR: el
        en_GB: en_GB
        eo_UY: eo
        es_ES: es
        et_EE: et
        eu_ES: eu
        fa_IR: fa
        fi_FI: fi
        fr_FR: fr
        ga_IE: ga
        gl_ES: gl
        he_IL: he
        hi_IN: hi
        hr_HR: hr
        hu_HU: hu
        id_ID: id
        it_IT: it_IT
        ja_JP: ja
        ka_GE: ka
        kab_KAB: kab
        kn_IN: kn
        ko_KR: ko_KR
        lt_LT: lt_LT
        lv_LV: lv
        mk_MK: mk
        ms_MY: ms
        nb_NO: nb_NO
        nl_NL: nl_NL
        nn_NO: nn
        or_IN: or
        pl_PL: pl
        pt_BR: pt_BR
        pt_PT: pt_PT
        ro_RO: ro
        ru_RU: ru
        si_LK: si
        sk_SK: sk
        sl_SI: sl
        sr_SP: sr
        sv_SE: sv
        th_TH: th
        tr_TR: tr
        uk_UA: uk
        ur_IN: ur
        uz_UZ: uz

  # Optional set — the long-press explainers (27 strings, over half the words).
  # A language ships on Labels alone; these fall back to English per string.
  - source: /l10n/templates/foot-cream-help.pot
    translation: /l10n/%locale_with_underscore%/help.po
    languages_mapping: *footcream_locales
